<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%" style="background:#ffffff; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="44" font-size="20" font-weight="800" fill="#0f172a">LEASH — Enforcement Architecture &amp; Trust Boundaries</text>
  <text x="40" y="68" font-size="12" font-weight="500" fill="#64748b">Cryptographic HMAC-Signed Receipts • System of Record Invariant Verification • Air-Gapped Tool Execution</text>

  <!-- Trust Boundary Line -->
  <line x1="280" y1="90" x2="280" y2="390" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4" />
  <rect x="235" y="95" width="90" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="242" y="109" font-size="10" font-weight="700" fill="#475569" font-family="'JetBrains Mono', monospace">AIR-GAP BOUND</text>

  <!-- Block 1: Untrusted Agent -->
  <g transform="translate(40, 140)">
    <rect width="200" height="180" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtle-shadow)"/>
    <rect width="200" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#e11d48" />
    <text x="32" y="21" font-size="11" font-weight="700" fill="#0f172a">Untrusted Agent</text>
    <text x="14" y="60" font-size="11" fill="#475569">• Autonomous LLM / LangChain</text>
    <text x="14" y="80" font-size="11" fill="#475569">• Susceptible to Prompt Injection</text>
    <text x="14" y="100" font-size="11" fill="#475569">• Untrusted Customer Ingestion</text>
    <rect x="14" y="125" width="172" height="36" rx="4" fill="#fff1f2" stroke="#fecdd3" />
    <text x="22" y="142" font-size="10" font-weight="700" fill="#9f1239">ZERO CREDENTIAL ACCESS</text>
    <text x="22" y="153" font-size="9" fill="#be123c">Cannot call protected tools directly</text>
  </g>

  <!-- Flow 1: Proposed Action -->
  <path d="M 240 200 L 370 200" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow-indigo)"/>
  <rect x="255" y="185" width="100" height="18" rx="3" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="260" y="198" font-size="10" font-weight="600" fill="#3730a3" font-family="'JetBrains Mono', monospace">POST /propose</text>

  <!-- Block 2: LEASH Gateway -->
  <g transform="translate(380, 110)">
    <rect width="290" height="250" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2" filter="url(#subtle-shadow)"/>
    <rect width="290" height="36" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#4f46e5" />
    <text x="32" y="22" font-size="12" font-weight="800" fill="#1e1b4b">LEASH Gateway (Port 8000)</text>
    <text x="195" y="22" font-size="10" font-weight="700" fill="#4338ca" font-family="'JetBrains Mono', monospace">&lt;10ms p50</text>
    
    <!-- Stages list -->
    <text x="16" y="60" font-size="10.5" font-weight="600" fill="#334155">0. Quarantine Check (Circuit Breaker)</text>
    <text x="16" y="80" font-size="10.5" font-weight="600" fill="#334155">1. Role Scope (Default-Deny ACL)</text>
    <text x="16" y="100" font-size="10.5" font-weight="600" fill="#334155">2. Parameter Constraints &amp; Schema</text>
    <text x="16" y="122" font-size="11" font-weight="800" fill="#047857" font-family="'JetBrains Mono', monospace">3. SoR Effect Checks (Ground Truth)</text>
    <text x="16" y="142" font-size="10.5" font-weight="600" fill="#334155">4. Provenance &amp; Untrusted Taint Tag</text>
    <text x="16" y="162" font-size="10.5" font-weight="600" fill="#334155">5. DLP Redaction (PCI / PII Scan)</text>
    <text x="16" y="182" font-size="10.5" font-weight="600" fill="#334155">6. Action-Bound Quorum (&gt;$300 Escalate)</text>
    <text x="16" y="202" font-size="11" font-weight="800" fill="#4338ca" font-family="'JetBrains Mono', monospace">7. HMAC-SHA256 Receipt Minting</text>

    <!-- Fail-Closed badge -->
    <rect x="16" y="218" width="258" height="20" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="24" y="232" font-size="9.5" font-weight="600" fill="#64748b">Fail-Closed Guarantee: Any exception = BLOCK</text>
  </g>

  <!-- Flow 2: Signed Receipt to Tool Server -->
  <path d="M 670 200 L 770 200" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <rect x="680" y="185" width="80" height="18" rx="3" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="686" y="198" font-size="9.5" font-weight="700" fill="#065f46" font-family="'JetBrains Mono', monospace">HMAC Receipt</text>

  <!-- Block 3: Protected Tool Server -->
  <g transform="translate(780, 110)">
    <rect width="270" height="120" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#subtle-shadow)"/>
    <rect width="270" height="34" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#059669" />
    <text x="32" y="21" font-size="11" font-weight="800" fill="#064e3b">Protected Tool Server (:8001)</text>
    <text x="16" y="58" font-size="10" fill="#334155">• Verifies HMAC-SHA256 signature</text>
    <text x="16" y="74" font-size="10" fill="#334155">• Enforces Single-Use Nonce (Replay Def)</text>
    <text x="16" y="90" font-size="10" fill="#334155">• Validates Action Hash == Current Args</text>
    <text x="16" y="106" font-size="10" fill="#334155">• 60-Second Strict Expiration Window</text>
  </g>

  <!-- Flow 3: Downstream SQLite SoR -->
  <path d="M 915 230 L 915 270" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Block 4: System of Record -->
  <g transform="translate(780, 275)">
    <rect width="270" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#subtle-shadow)"/>
    <rect width="270" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="19" font-size="11" font-weight="700" fill="#0f172a">SQLite System of Record (SoR)</text>
    <text x="16" y="48" font-size="10" fill="#475569">Customers • Orders • Verified Contacts • Payer of Record</text>
    <text x="16" y="68" font-size="9.5" font-weight="600" fill="#047857" font-family="'JetBrains Mono', monospace">Authoritative Ground Truth Ledger</text>
  </g>

  <!-- Flow 4: Blocked Direct Probe Attempt -->
  <path d="M 140 320 C 140 375, 780 375, 780 230" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-rose)"/>
  <rect x="420" y="375" width="220" height="20" rx="3" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="430" y="389" font-size="10" font-weight="700" fill="#9f1239">Direct Bypass: 401 Unauthorized (No Receipt)</text>
</svg>
