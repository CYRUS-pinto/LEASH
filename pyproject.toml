[project]
name = "leash"
version = "0.1.0"
description = "LEASH: Deterministic Policy-Enforcing Gateway for Autonomous Agent Tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "sqlparse>=0.5.0",
    "python-dotenv>=1.0.0"
]

[tool.vercel]
entrypoint = "gateway.server:app"
